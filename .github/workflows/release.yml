name: Release skill zips

# Publishing a GitHub release attaches one upload-ready zip per skill —
# the files people download for claude.ai and ChatGPT.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the skills still run
        run: |
          pip install openpyxl
          python3 skills/construction-critical-path/scripts/cpm.py skills/construction-critical-path/assets/example-schedule.json
          cd skills/construction-qa-checklists && python3 scripts/build_workbook.py assets/example-selection.json -o /tmp/qa.xlsx
      - name: Build zips
        run: ./scripts/package.sh
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
